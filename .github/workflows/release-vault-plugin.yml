# DEPRECATED (removed in v0.2.0): thin wrapper over release-goreleaser.yml; call that directly.
name: release-vault-plugin

on:
  workflow_call:
    inputs:
      vault_role:
        description: Role on the jwt/github/iuclabs Vault auth mount.
        type: string
        default: release
      snapshot:
        description: Build everything without Vault, signing or publishing.
        type: boolean
        default: false
      image:
        description: Build and push the plugin image; false leaves the image outputs empty.
        type: boolean
        default: true
      runs_on:
        description: Runner label.
        type: string
        default: iuclabs-release
      working_directory:
        description: Directory holding .goreleaser.yml.
        type: string
        default: .
    outputs:
      artifacts:
        description: goreleaser dist/artifacts.json.
        value: ${{ jobs.release.outputs.artifacts }}
      image:
        description: Pushed plugin image as <ref>:<tag>@<digest>; snapshot pushes to a job-local registry; empty when image is false.
        value: ${{ jobs.release.outputs.image }}
      image_configs:
        description: JSON array of each platform image's config; empty when image is false.
        value: ${{ jobs.release.outputs.image_configs }}

permissions: {}

jobs:
  release:
    uses: ./.github/workflows/release-goreleaser.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      vault_role: ${{ inputs.vault_role }}
      snapshot: ${{ inputs.snapshot }}
      image: ${{ inputs.image }}
      runs_on: ${{ inputs.runs_on }}
      working_directory: ${{ inputs.working_directory }}
