# docker build of each distros/<name>/ from its distro.env; on a v* tag push, docker push to artifactapi with a Vault-minted token. Callers grant `contents: read` and `id-token: write`; only the tag-run push jobs use the latter.
name: container-image

on:
  workflow_call:
    inputs:
      push:
        description: Push on v* tag push runs; false never pushes. Other refs and events never push.
        type: boolean
        default: true
      target:
        description: Dockerfile stage to build and push; empty builds the last stage.
        type: string
        default: ""
      test_target:
        description: Dockerfile stage built (never pushed) before target on every run, e.g. a smoke test; empty skips it.
        type: string
        default: ""
      vault_role:
        description: Role on the jwt/github/iuclabs Vault auth mount; needs identity/oidc/token/artifactapi-writer.
        type: string
        default: release
      runs_on:
        description: Runner label; needs a Docker daemon that trusts artifactapi.
        type: string
        default: iuclabs-build
      working_directory:
        description: Directory holding the Dockerfile and distros/.
        type: string
        default: .

permissions: {}

env:
  VAULT_ADDR: https://vault.service.consul:8200
  REGISTRY: artifactapi.k8s.syd1.au.unkin.net

jobs:
  distros:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    outputs:
      distros: ${{ steps.list.outputs.distros }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        working-directory: ${{ inputs.working_directory }}
        run: |
          distros=$(find distros -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rnc '[inputs]')
          jq -e 'length > 0' <<<"${distros}" >/dev/null || { echo "::error::no directories under distros/"; exit 1; }
          echo "distros=${distros}" >> "${GITHUB_OUTPUT}"

  build:
    needs: distros
    if: ${{ !(inputs.push && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.distros.outputs.distros) }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &build
        id: build
        env:
          DISTRO: ${{ matrix.distro }}
          TARGET: ${{ inputs.target }}
          TEST_TARGET: ${{ inputs.test_target }}
        run: |
          set -u
          # shellcheck disable=SC1090
          . "distros/${DISTRO}/distro.env"
          version=dev
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; fi
          repo="${REGISTRY}/docker-internal/${IMAGE:?distros/${DISTRO}/distro.env must set IMAGE}"
          ref="${repo}:${version}${TAG_SUFFIX:+-${TAG_SUFFIX}}"
          args=(--build-arg "DISTRO=${DISTRO}")
          for name in ${BUILD_ARGS:-}; do args+=(--build-arg "${name}=${!name}"); done
          if [ -n "${TEST_TARGET}" ]; then docker build "${args[@]}" --target "${TEST_TARGET}" .; fi
          if [ -n "${TARGET}" ]; then args+=(--target "${TARGET}"); fi
          docker build "${args[@]}" -t "${ref}" .
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          if [ "${DEFAULT:-}" = true ]; then echo "default_ref=${repo}:${version}" >> "${GITHUB_OUTPUT}"; fi

  push:
    needs: distros
    if: ${{ inputs.push && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.distros.outputs.distros) }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *build
      # login after the build: vault tokens live 15m
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: jwt/github/iuclabs
          role: ${{ inputs.vault_role }}
          jwtGithubAudience: ${{ env.VAULT_ADDR }}
          secrets: |
            identity/oidc/token/artifactapi-writer token | ARTIFACTAPI_TOKEN
      - run: |
          docker login "${REGISTRY}" -u ci --password-stdin <<<"${ARTIFACTAPI_TOKEN}"
          docker push "${REF}"
          if [ -n "${DEFAULT_REF}" ]; then
            docker tag "${REF}" "${DEFAULT_REF}"
            docker push "${DEFAULT_REF}"
          fi
        env:
          # keep the token out of ~/.docker on long-lived runners
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          REF: ${{ steps.build.outputs.ref }}
          DEFAULT_REF: ${{ steps.build.outputs.default_ref }}
