name: self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # shellcheck is preinstalled on the runner, so actionlint also lints run: blocks
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor
        run: uvx zizmor@1.32.0 --format=github .github/
        env:
          GH_TOKEN: ${{ github.token }}

  ci:
    uses: ./.github/workflows/pre-commit.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      working_directory: testdata/pre-commit
      python_version: "3.13"
      go_version_file: testdata/go-mod/go.mod

  ci-prek:
    uses: ./.github/workflows/pre-commit.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      tool: prek
      working_directory: testdata/pre-commit
      go_version_file: testdata/go-mod/go.mod

  actions:
    uses: ./.github/workflows/actions.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    with:
      working_directory: testdata/actions/good
      min_severity: informational
      zizmor_config: ../../../zizmor.yml

  actions-rejects-bad:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - run: |
          if go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 testdata/actions/bad/workflow.yml > out.txt; then
            echo "actionlint passed a workflow it must reject" >&2; exit 1
          fi
          cat out.txt
          grep -q 'no_such_property' out.txt
          grep -q 'SC2086' out.txt

  go:
    uses: ./.github/workflows/go-ci.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    permissions:
      contents: read
      pull-requests: read
    with:
      working_directory: testdata/go-mod
      golangci_lint_version: v2.15.0
      cover_min: 90
      cover_exclude: /cmd/

  release-vault-plugin:
    uses: ./.github/workflows/release-vault-plugin.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    if: github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
    # the called job declares release permissions; snapshot mode uses none of them
    permissions:
      contents: write
      id-token: write
      packages: write
    with:
      snapshot: true
      runs_on: ubuntu-latest
      working_directory: testdata/vault-plugin

  assert-vault-plugin:
    needs: release-vault-plugin
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          jq -e 'any(.[]; .type == "Binary" and .name == "vault-plugin-fixture")' <<<"${ARTIFACTS}"
          jq -e '[.[] | select(.type == "Linux Package" and (.name | endswith(".rpm")))] | length == 2' <<<"${ARTIFACTS}"
          jq -e 'any(.[]; .type == "Docker Image" and (.name | startswith("ghcr.io/iuclabs/vault-plugin-fixture:")))' <<<"${ARTIFACTS}"
        env:
          ARTIFACTS: ${{ needs.release-vault-plugin.outputs.artifacts }}

  release-terraform-provider:
    uses: ./.github/workflows/release-terraform-provider.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    if: github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
    # the called job declares release permissions; snapshot mode uses none of them
    permissions:
      contents: write
      id-token: write
    with:
      snapshot: true
      runs_on: ubuntu-latest
      working_directory: testdata/terraform-provider

  assert-terraform-provider:
    needs: release-terraform-provider
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          jq -e 'any(.[]; .type == "Archive" and (.name | test("^terraform-provider-fixture_.*_linux_amd64\\.zip$")))' <<<"${ARTIFACTS}"
          jq -e 'any(.[]; .type == "Checksum")' <<<"${ARTIFACTS}"
        env:
          ARTIFACTS: ${{ needs.release-terraform-provider.outputs.artifacts }}

  release-go-image:
    uses: ./.github/workflows/release-go-image.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    if: github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
    # the called job declares packages: write for the push; push: false uses none of it
    permissions:
      contents: read
      packages: write
    with:
      main: ./cmd/go-mod
      push: false
      runs_on: ubuntu-latest
      working_directory: testdata/go-mod

  terraform:
    uses: ./.github/workflows/terraform.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    if: github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
    # the called plan and apply jobs declare id-token: write for Vault; with no vault roles it is unused
    permissions:
      contents: read
      id-token: write
    with:
      runs_on: ubuntu-latest
      working_directory: testdata/terragrunt
      environments_dir: environments
      ca_file: ""
      reachability_urls: https://registry.opentofu.org/.well-known/terraform.json
      env: |
        TF_VAR_greeting=from-env
      apply_event: ${{ github.event_name }}
      apply_concurrency_group: self-test-${{ github.run_id }}-terraform
      apply_ref: ${{ github.ref }}
      checks_on_apply: true

  terraform-default-branch:
    uses: ./.github/workflows/terraform.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    if: github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
    with:
      runs_on: ubuntu-latest
      working_directory: testdata/terragrunt
      environments_dir: environments
      ca_file: ""
      env: |
        TF_VAR_greeting=from-env
      apply_event: ${{ github.event_name }}
      apply_concurrency_group: self-test-${{ github.run_id }}-terraform-default-branch

  terraform-other-event:
    uses: ./.github/workflows/terraform.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    if: github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
    with:
      runs_on: ubuntu-latest
      working_directory: testdata/terragrunt
      environments_dir: environments
      ca_file: ""
      env: |
        TF_VAR_greeting=from-env
      apply_event: workflow_dispatch
      apply_ref: ${{ github.ref }}

  assert-apply-guards:
    needs: [terraform, terraform-default-branch, terraform-other-event]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "applied: fixture=$FIXTURE default-branch=$DEFAULT_BRANCH other-event=$OTHER_EVENT on $REF"
          [ "$FIXTURE" = true ]
          [ -z "$OTHER_EVENT" ]
          if [ "$REF" = refs/heads/main ]; then [ "$DEFAULT_BRANCH" = true ]; else [ -z "$DEFAULT_BRANCH" ]; fi
        env:
          FIXTURE: ${{ needs.terraform.outputs.applied }}
          DEFAULT_BRANCH: ${{ needs.terraform-default-branch.outputs.applied }}
          OTHER_EVENT: ${{ needs.terraform-other-event.outputs.applied }}
          REF: ${{ github.ref }}

  terraform-apply-unchecked:
    uses: ./.github/workflows/terraform.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
    with:
      runs_on: ubuntu-latest
      working_directory: testdata/terragrunt
      environments_dir: environments
      ca_file: ""
      env: |
        TF_VAR_greeting=from-env
      apply_event: ${{ github.event_name }}
      apply_concurrency_group: self-test-${{ github.run_id }}-terraform-apply-unchecked
      apply_ref: ${{ github.ref }}
      checks_on_apply: false

  assert-apply-unchecked:
    needs: terraform-apply-unchecked
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - run: |
          [ "$APPLIED" = true ]
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | "\(.name)=\(.conclusion)"' >jobs.txt
          cat jobs.txt
          for j in fmt tflint validate plan; do
            grep -qx "terraform-apply-unchecked / $j=skipped" jobs.txt
          done
        env:
          APPLIED: ${{ needs.terraform-apply-unchecked.outputs.applied }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}

  terraform-env-rejects-bad:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          w=.github/workflows/terraform.yml
          # diff guards against un-anchoring the export env steps
          yq 'explode(.) | .jobs.plan.steps[] | select(.name == "export env") | .run' "$w" >"$RUNNER_TEMP/export.sh"
          yq 'explode(.) | .jobs.apply.steps[] | select(.name == "export env") | .run' "$w" | diff "$RUNNER_TEMP/export.sh" -
          try() { : >"$RUNNER_TEMP/env.out"; GITHUB_ENV="$RUNNER_TEMP/env.out" ENV_INPUT="$1" TF_ENV_SECRET="$2" bash -e "$RUNNER_TEMP/export.sh" >/dev/null; }
          for bad in 'lower=1' 'PATH=/x' 'GITHUB_X=1' 'NODE_OPTIONS=--x' 'HTTPS_PROXY=http://x' 'NOEQUALS'; do
            if try "$bad" ""; then echo "::error::export env accepted '$bad'"; exit 1; fi
            echo "rejected: $bad"
          done
          if try "" 'VAULT_TOKEN=x'; then echo "::error::tf_env accepted VAULT_TOKEN"; exit 1; fi
          echo "rejected tf_env: VAULT_TOKEN=x"
          try 'TF_VAR_greeting=hi' 'TF_VAR_secret=s3cret'
          grep -qx 'TF_VAR_greeting=hi' "$RUNNER_TEMP/env.out"
          grep -qx 'TF_VAR_secret=s3cret' "$RUNNER_TEMP/env.out"
          echo "accepted: TF_VAR_greeting=hi, tf_env TF_VAR_secret"
