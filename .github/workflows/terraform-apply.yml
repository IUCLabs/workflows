# terragrunt apply on the default branch, queued per repo. Callers grant `contents: read` and `id-token: write`.
name: terraform-apply

on:
  workflow_call:
    inputs:
      runs_on:
        description: Runner label.
        type: string
        default: iuclabs-infra
      working_directory:
        description: Repo directory holding the terraform and terragrunt tree.
        type: string
        default: .
      environments_dir:
        description: Newline-separated terragrunt dirs, relative to working_directory, each applied with `run --all`.
        type: string
        default: .
      parallelism:
        description: terragrunt --parallelism for the apply.
        type: number
        default: 2
      init_args:
        description: Arguments after `--` for `terragrunt run --all init`.
        type: string
        default: -upgrade
      apply_args:
        description: Arguments after `--` for `terragrunt run --all apply`.
        type: string
        default: ""
      apply_ref:
        description: Only this ref applies; empty means the default branch.
        type: string
        default: ""
      tofu_version:
        description: OpenTofu version.
        type: string
        default: 1.10.3
      tofu_sha256:
        description: sha256 of tofu_<version>_linux_amd64.tar.gz.
        type: string
        default: 610464b31c6c5c9a6e1f282995117111b98464f337e2df1bb0a9958fee5e82bd
      terragrunt_version:
        description: Terragrunt version.
        type: string
        default: 1.0.3
      terragrunt_sha256:
        description: sha256 of terragrunt_linux_amd64.
        type: string
        default: e27c202df4383712e55b39e36dedd9439688ac3ac745c1f71521437f831274b1
      tflint_version:
        description: TFLint version.
        type: string
        default: 0.62.0
      tflint_sha256:
        description: sha256 of tflint_linux_amd64.zip.
        type: string
        default: 000400d7f4c2236d9ed4b35fec3ee95617c3747571593cc6138169fc78cc226a
      ca_file:
        description: Internal CA appended to the system bundle and exported as CA_BUNDLE, VAULT_CACERT and SSL_CERT_FILE; empty skips.
        type: string
        default: /etc/vault-ca/ca.crt
      vault_addr:
        description: Vault address, exported as VAULT_ADDR and used as the JWT audience.
        type: string
        default: https://vault.service.consul:8200
      vault_path:
        description: Vault JWT auth mount.
        type: string
        default: jwt/github/iuclabs
      vault_role:
        description: Vault JWT role for the apply job; empty skips the Vault login.
        type: string
        default: ""
      vault_secrets:
        description: hashicorp/vault-action `secrets` mapping (`path key | ENV ;` lines).
        type: string
        default: ""
      env:
        description: Newline-separated KEY=value pairs exported before terragrunt runs.
        type: string
        default: ""
    secrets:
      tf_env:
        description: Like the env input, for secret values; with secrets inherit, a TF_ENV repo or org secret.
        required: false

permissions: {}

env:
  VAULT_ADDR: ${{ inputs.vault_addr }}
  TF_IN_AUTOMATION: "1"

jobs:
  apply:
    if: github.ref == (inputs.apply_ref || format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-apply-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install tofu, terragrunt and tflint
        run: |
          bin="$RUNNER_TEMP/bin"
          dl="$RUNNER_TEMP/dl"
          mkdir -p "$bin" "$dl"
          fetch() {
            curl -fsSL --retry 3 -o "$dl/$1" "$2"
            echo "$3  $dl/$1" | sha256sum -c -
          }
          fetch tofu.tar.gz "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz" "$TOFU_SHA256"
          tar -xzf "$dl/tofu.tar.gz" -C "$bin" tofu
          fetch terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" "$TERRAGRUNT_SHA256"
          install -m0755 "$dl/terragrunt" "$bin/terragrunt"
          fetch tflint.zip "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" "$TFLINT_SHA256"
          unzip -qo "$dl/tflint.zip" tflint -d "$bin"
          echo "$bin" >>"$GITHUB_PATH"
          if [ -n "$CA_FILE" ]; then
            cat /etc/ssl/certs/ca-certificates.crt "$CA_FILE" >"$RUNNER_TEMP/ca-bundle.crt"
            for v in CA_BUNDLE VAULT_CACERT SSL_CERT_FILE; do echo "$v=$RUNNER_TEMP/ca-bundle.crt" >>"$GITHUB_ENV"; done
          fi
        env:
          TOFU_VERSION: ${{ inputs.tofu_version }}
          TOFU_SHA256: ${{ inputs.tofu_sha256 }}
          TERRAGRUNT_VERSION: ${{ inputs.terragrunt_version }}
          TERRAGRUNT_SHA256: ${{ inputs.terragrunt_sha256 }}
          TFLINT_VERSION: ${{ inputs.tflint_version }}
          TFLINT_SHA256: ${{ inputs.tflint_sha256 }}
          CA_FILE: ${{ inputs.ca_file }}
      - name: export env
        run: |
          export_lines() {
            local n=0 line key
            while IFS= read -r line || [ -n "$line" ]; do
              n=$((n + 1))
              [ -z "${line//[[:space:]]/}" ] && continue
              key=${line%%=*}
              if [ "$key" = "$line" ]; then echo "::error::$1 line $n has no '='"; exit 1; fi
              if ! [[ $key =~ ^[A-Z_][A-Z0-9_]*$ || $key =~ ^TF_VAR_[A-Za-z0-9_]+$ ]]; then echo "::error::$1 line $n: key must match ^[A-Z_][A-Z0-9_]*\$ or be TF_VAR_<name>"; exit 1; fi
              case "$key" in
                GITHUB_* | RUNNER_* | ACTIONS_* | PATH | LD_* | BASH_ENV | NODE_OPTIONS)
                  echo "::error::$1 line $n: $key may not be set"; exit 1 ;;
              esac
              if [ "$1" = tf_env ]; then echo "::add-mask::${line#*=}"; fi
              printf '%s=%s\n' "$key" "${line#*=}" >>"$GITHUB_ENV"
            done <<<"$2"
          }
          export_lines env "$ENV_INPUT"
          export_lines tf_env "$TF_ENV_SECRET"
        env:
          ENV_INPUT: ${{ inputs.env }}
          TF_ENV_SECRET: ${{ secrets.tf_env }}
      - if: inputs.vault_role != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault_addr }}
          method: jwt
          path: ${{ inputs.vault_path }}
          role: ${{ inputs.vault_role }}
          jwtGithubAudience: ${{ inputs.vault_addr }}
          exportToken: true
          secrets: ${{ inputs.vault_secrets }}
      - id: init
        run: |
          read -ra args <<<"$INIT_ARGS"
          terragrunt run --all --non-interactive init ${args[0]:+-- "${args[@]}"}
        env:
          INIT_ARGS: ${{ inputs.init_args }}
      - if: ${{ !cancelled() && steps.init.outcome == 'success' }}
        run: |
          read -ra args <<<"$APPLY_ARGS"
          rc=0
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            terragrunt run --all --working-dir "$dir" --parallelism "$PARALLELISM" --non-interactive apply ${args[0]:+-- "${args[@]}"} || rc=1
          done <<<"$ENVIRONMENTS_DIR"
          exit $rc
        env:
          APPLY_ARGS: ${{ inputs.apply_args }}
          PARALLELISM: ${{ inputs.parallelism }}
          ENVIRONMENTS_DIR: ${{ inputs.environments_dir }}
