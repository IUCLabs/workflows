repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        files: ^testdata/pre-commit/

  - repo: local
    hooks:
      - id: go-version
        name: go is on PATH
        entry: go version
        language: system
        pass_filenames: false
        always_run: true
